AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Tethys portal - Fargate cluster + CloudWatch log groups. FARGATE + FARGATE_SPOT capacity
  providers, Container Insights on. All names derive from Org/App so the stack is reusable across
  organizations and can be promoted in place to production.

Parameters:
  Org:
    Type: String
    Description: Organization short name (e.g. acme). Combined with App into all resource names.
  App:
    Type: String
    Default: portal
    Description: Application short name. Names become ${Org}-${App}-*.
  Environment:
    Type: String
    Default: production
    AllowedValues: [staging, production]
    Description: Value for the `env` tag.
  LogRetentionDays:
    Type: Number
    Default: 30

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${Org}-${App}"
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }
      Tags:
        - { Key: project, Value: !Sub "${Org}-${App}" }
        - { Key: env, Value: !Ref Environment }

  PortalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${Org}-${App}/portal"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ClusterName:     { Value: !Ref Cluster,            Export: { Name: !Sub "${AWS::StackName}-ClusterName" } }
  ClusterArn:      { Value: !GetAtt Cluster.Arn,     Export: { Name: !Sub "${AWS::StackName}-ClusterArn" } }
  PortalLogGroup:  { Value: !Ref PortalLogGroup,     Export: { Name: !Sub "${AWS::StackName}-PortalLogGroup" } }
