AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Tethys portal - IAM roles for the Fargate tasks.
    * Execution role: ECR pull + CloudWatch logs (managed policy) + SSM GetParameters for secrets.
    * Task role: S3 write to the static bucket (collectstatic via django-storages).
  Names derive from Org/App; the static bucket and SSM prefix are parameters (no defaults).

Parameters:
  Org:
    Type: String
    Description: Organization short name (e.g. acme).
  App:
    Type: String
    Default: portal
  Environment:
    Type: String
    Default: production
    AllowedValues: [staging, production]
  StaticBucketName:
    Type: String
    Description: S3 bucket holding the collected static files (from static-cdn.yaml).
  SsmPrefix:
    Type: String
    Description: >
      SSM parameter path prefix the execution role may read (task def `secrets`).
      Convention: /${Org}/${App} (e.g. /acme/portal).

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Org}-${App}-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ssm-secrets-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameters, ssm:GetParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" }
      Tags:
        - { Key: project, Value: !Sub "${Org}-${App}" }
        - { Key: env, Value: !Ref Environment }

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Org}-${App}-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: static-s3-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub "arn:aws:s3:::${StaticBucketName}"
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "arn:aws:s3:::${StaticBucketName}/*"
      Tags:
        - { Key: project, Value: !Sub "${Org}-${App}" }
        - { Key: env, Value: !Ref Environment }

Outputs:
  ExecutionRoleArn: { Value: !GetAtt ExecutionRole.Arn, Export: { Name: !Sub "${AWS::StackName}-ExecRoleArn" } }
  TaskRoleArn:      { Value: !GetAtt TaskRole.Arn,      Export: { Name: !Sub "${AWS::StackName}-TaskRoleArn" } }
