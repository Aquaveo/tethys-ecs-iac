name: tofu deploy (portal infra)

# TEMPLATE — copy into a portal repo's .github/workflows/. The portal repo holds its own
# tofu/<org>.tfvars + tofu/backend.hcl; this checks out the general module from the public
# Aquaveo/tethys-ecs-iac and runs it against the portal's state key. Auth is GitHub OIDC.
#
# Repo settings required:
#   secret  AWS_DEPLOY_ROLE_ARN  -> the deploy role ARN (output of deploy/github-oidc-tofu.yaml)
#   var     AWS_REGION           -> e.g. us-east-1

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan (preview) or apply (make changes)"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      iac_ref:
        description: "Aquaveo/tethys-ecs-iac ref (branch/tag to pin)"
        required: false
        default: main
        type: string

permissions:
  id-token: write # OIDC
  contents: read

env:
  TFVARS: tofu/<org>.tfvars # <-- EDIT to your tfvars path
  BACKEND: tofu/backend.hcl # <-- EDIT if different

jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (tfvars + backend)
        uses: actions/checkout@v4

      - name: Checkout the general IaC module
        uses: actions/checkout@v4
        with:
          repository: Aquaveo/tethys-ecs-iac
          ref: ${{ inputs.iac_ref }}
          path: iac

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.3"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: tofu init
        working-directory: iac/tofu
        run: tofu init -input=false -backend-config="${GITHUB_WORKSPACE}/${BACKEND}"

      - name: tofu plan
        working-directory: iac/tofu
        run: tofu plan -input=false -var-file="${GITHUB_WORKSPACE}/${TFVARS}" -out=tfplan

      - name: tofu apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: iac/tofu
        run: tofu apply -input=false tfplan
