name: sync secrets to SSM

# TEMPLATE — copy into a portal repo's .github/workflows/ and set SSM_PREFIX below.
#
# Pushes the portal's secrets from GitHub Secrets into SSM SecureStrings under <SSM_PREFIX>/*, where
# the ECS task reads them at runtime. Run once at setup and again whenever you rotate a secret. Auth
# is GitHub OIDC -> the deploy role (no stored AWS keys). Secrets never touch tofu state.
#
# Repo settings required:
#   secret  AWS_DEPLOY_ROLE_ARN  -> role with ssm:PutParameter (the tofu deploy role works)
#   var     AWS_REGION           -> e.g. us-east-1
#   secrets DB_PASSWORD, PS_CONNECTION, SECRET_KEY, SUPERUSER_PASSWORD  (set the ones you want to push)

on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

env:
  SSM_PREFIX: /<org>/<app> # <-- EDIT: e.g. /acme/portal

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Put SecureString parameters
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PS_CONNECTION: ${{ secrets.PS_CONNECTION }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: |
          set -euo pipefail
          put() {  # put <ssm-name-suffix> <value>
            local name="${SSM_PREFIX}/$1" val="$2"
            if [ -z "$val" ]; then echo "skip ${name} (no GitHub secret set)"; return; fi
            aws ssm put-parameter --name "$name" --type SecureString --value "$val" --overwrite >/dev/null
            echo "put ${name}"
          }
          put db-password               "$DB_PASSWORD"
          put ps-connection             "$PS_CONNECTION"
          put secret-key                "$SECRET_KEY"
          put portal-superuser-password "$SUPERUSER_PASSWORD"
