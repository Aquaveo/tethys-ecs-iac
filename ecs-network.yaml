AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Tethys portal - networking for the Fargate stack: security groups (ALB / web task) and the portal
  ALB (HTTP:80 for now; add HTTPS:443 + an ACM cert + your DNS before production cutover) with the
  portal target group. Reuses an existing VPC. Names derive from Org/App so the stack is reusable.

Parameters:
  Org:
    Type: String
    Description: Organization short name (e.g. acme).
  App:
    Type: String
    Default: portal
  Environment:
    Type: String
    Default: production
    AllowedValues: [staging, production]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC the portal runs in.
  AlbSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB (use the AZs that have your EFS mount targets, if any).
  WebPort:
    Type: Number
    Default: 8000

Resources:
  # ---- Security groups ---------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Org}-${App} ALB (public HTTP)"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet (pre-cutover; add 443 before production)
      Tags:
        - { Key: project, Value: !Sub "${Org}-${App}" }
        - { Key: env, Value: !Ref Environment }

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Org}-${App} web task"
      VpcId: !Ref VpcId
      Tags:
        - { Key: project, Value: !Sub "${Org}-${App}" }
        - { Key: env, Value: !Ref Environment }

  WebFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref WebPort
      ToPort: !Ref WebPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: uvicorn from the ALB

  # ---- ALB ---------------------------------------------------------------------------------------
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${Org}-${App}-alb"
      Type: application
      Scheme: internet-facing
      Subnets: !Ref AlbSubnets
      SecurityGroups: [!Ref AlbSecurityGroup]
      Tags:
        - { Key: project, Value: !Sub "${Org}-${App}" }
        - { Key: env, Value: !Ref Environment }

  PortalTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Org}-${App}-tg"
      VpcId: !Ref VpcId
      TargetType: ip                 # Fargate (awsvpc) registers task IPs
      Port: !Ref WebPort
      Protocol: HTTP
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      Matcher: { HttpCode: "200-399" }
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PortalTargetGroup

Outputs:
  WebSecurityGroupId:   { Value: !Ref WebSecurityGroup,    Export: { Name: !Sub "${AWS::StackName}-WebSG" } }
  PortalTargetGroupArn: { Value: !Ref PortalTargetGroup,   Export: { Name: !Sub "${AWS::StackName}-PortalTG" } }
  AlbDNSName:           { Value: !GetAtt Alb.DNSName,      Export: { Name: !Sub "${AWS::StackName}-AlbDNS" } }
